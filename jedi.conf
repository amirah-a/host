# /etc/httpd/conf.d/rapp_2025.conf
# Apache remote server configuration to be copied to the location above

Listen 25112

<VirtualHost 127.0.0.1:25112>
    ServerName localhost
    DocumentRoot /var/www/html/host_2026/public

    <Directory /var/www/html/host_2026/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    # Optional: Error and access logs
    ErrorLog /var/log/httpd/host_2026_error.log
    CustomLog /var/log/httpd/host_2026_access.log combined
</VirtualHost>

